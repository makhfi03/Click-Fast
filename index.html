<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Click Fast!</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-soft: #eef4ff;
      --text: #172033;
      --muted: #657184;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f97316;
      --border: #dce5f2;
      --shadow: 0 18px 45px rgba(23, 32, 51, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(37, 99, 235, 0.08), transparent 280px),
        var(--bg);
    }

    body::before {
      content: "";
      display: block;
      width: 70px;
      height: 5px;
      margin: 0 auto 22px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .view {
      display: none;
      width: min(92vw, 560px);
      margin: 0 auto;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    #view-home {
      display: block;
    }

    h1,
    h2 {
      margin: 0 0 20px;
      line-height: 1.1;
    }

    h1 {
      font-size: clamp(2.4rem, 9vw, 4.5rem);
      color: var(--primary);
    }

    h2 {
      font-size: 2rem;
    }

    p {
      margin: 12px 0;
      color: var(--muted);
    }

    button,
    input,
    select {
      width: 100%;
      min-height: 46px;
      border-radius: var(--radius);
      font: inherit;
    }

    input,
    select {
      border: 1px solid var(--border);
      padding: 0 14px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
    }

    button {
      margin: 8px 0;
      border: 0;
      padding: 0 18px;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
      letter-spacing: 0;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button[type="button"],
    #btn-to-history,
    #btn-to-menu {
      color: var(--primary);
      background: var(--surface-soft);
      box-shadow: none;
    }

    button[type="button"]:hover,
    #btn-to-history:hover,
    #btn-to-menu:hover {
      background: #dbeafe;
    }

    #config-form {
      display: grid;
      gap: 12px;
    }

    #config-form p {
      margin: 0;
    }

    #arena {
      width: min(92vw, 500px);
      aspect-ratio: 1;
      border: 2px solid var(--border);
      position: relative;
      margin: 18px auto 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        #ffffff;
      background-size: 40px 40px;
      border-radius: var(--radius);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    }

    #target {
      position: absolute;
      background: radial-gradient(circle at 35% 30%, #ffedd5 0 14%, var(--accent) 15% 64%, #c2410c 65%);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(249, 115, 22, 0.28);
      transition: left 0.08s, top 0.08s, transform 0.08s;
    }

    #target:hover {
      transform: scale(1.04);
    }

    .hud {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      width: min(92vw, 560px);
      margin: 0 auto 16px;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .hud span,
    #history-list p,
    #view-results p {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
      color: var(--muted);
    }

    .hud span {
      min-width: 116px;
      margin: 0;
      font-weight: 700;
    }

    b {
      color: var(--text);
    }

    #view-game {
      width: auto;
      max-width: 620px;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    #history-list {
      display: grid;
      gap: 10px;
      margin: 18px 0;
      text-align: left;
    }

    #history-list p {
      margin: 0;
    }

    #res-record-badge {
      border-color: #86efac;
      background: #f0fdf4;
      color: #15803d !important;
      font-weight: 700;
    }

    @media (min-width: 520px) {
      #view-home button,
      #view-results button {
        width: calc(50% - 8px);
        margin-inline: 4px;
      }
    }

    @media (max-width: 520px) {
      .view {
        padding: 22px;
      }

      .hud span {
        flex: 1 1 calc(50% - 10px);
        min-width: 130px;
      }
    }
  </style>
</head>

<body>


  <div id="view-home" class="view">
    <h1>Click Fast!</h1>
    <button id="btn-to-config">Jouer</button>
    <button id="btn-to-history">Historique</button>
  </div>

  <div id="view-config" class="view">
  <h2>Configuration</h2>
  <form id="config-form">
    <p>
      <input type="text" id="pseudo" placeholder="Pseudo" value="Joueur">
    </p>
    <p>
      <select id="mode">
        <option value="Classique">Classique</option>
        <option value="Précision">Précision</option>
      </select>
    </p>
    <p>
      <select id="duration">
        <option value="10">10s</option>
        <option value="20">20s</option>
        <option value="30">30s</option>
      </select>
    </p>
    <p>
      <select id="difficulty">
        <option value="Facile">Facile</option>
        <option value="Moyenne" selected>Moyenne</option>
        <option value="Difficile">Difficile</option>
      </select>
    </p>
    <button type="submit">Lancer</button>
    <button type="button" id="btn-config-back">Retour</button>
  </form>
</div>

  <div id="view-game" class="view">
    <div class="hud">
      <span>Temps: <b id="hud-timer">0</b>s</span>
      <span>Score: <b id="hud-score">0</b></span>
      <span>Ratés: <b id="hud-misses">0</b></span>
      <span>Précision: <b id="hud-accuracy">100%</b></span>
    </div>
    <div id="arena">
      <div id="target"></div>
    </div>
  </div>

  <div id="view-results" class="view">
    <h2>Résultats</h2>
    <p>Joueur: <b id="res-pseudo"></b></p>
    <p>Score: <b id="res-score"></b></p>
    <p>Ratés: <b id="res-rates"></b></p>
    <p>Précision: <b id="res-accuracy"></b></p>
    <p id="res-record-badge" style="display:none; color:green;">Nouveau Record !</p>
    <button id="btn-replay">Rejouer</button>
    <button id="btn-to-menu">Menu</button>
  </div>

  <div id="view-history" class="view">
    <h2>Historique</h2>
    <div id="history-list"></div>
    <button id="btn-history-back">Retour</button>
  </div>

  <script src="main.js"></script>
</body>

</html>
